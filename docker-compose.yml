version: '3'

services:
  mcp-client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8501:8501"  # Local-only Streamlit app
      - "127.0.0.1:8000:8000"  # Local-only MCP server
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_ALLOW_PRIVATE_URLS=true
    restart: unless-stopped
